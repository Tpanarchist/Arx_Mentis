[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arx_mentis"
version = "0.1.0"
description = "A reversible-seam bootstrap for the Arx Mentis language project"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[project.scripts]
arx-mentis = "arx_mentis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arx_mentis"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

